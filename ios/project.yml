name: WorkBuddyRemote
options:
  bundleIdPrefix: cn.workbuddy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  WorkBuddyRemote:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/WorkBuddyRemote
        excludes:
          - "Info.plist"
          - "Assets.xcassets"
    resources:
      - path: Sources/WorkBuddyRemote/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.workbuddy.remote
        PRODUCT_NAME: WorkBuddyRemote
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Sources/WorkBuddyRemote/Info.plist
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
